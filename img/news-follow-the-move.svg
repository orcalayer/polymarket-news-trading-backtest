<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' role='img' aria-labelledby='t d'>
<title id='t'>Buying in the direction of a news move loses</title>
<desc id='d'>Grouped bar chart of returns for following a news move. May to mid-August: -13.0% after 1 hour, -15.0% after 4 hours, -22.6% after 24 hours, -17.8% at resolution. Mid-August to October: -16.3% after 1 hour, -21.3% after 4 hours, -19.5% after 24 hours, -12.0% at resolution.</desc>
