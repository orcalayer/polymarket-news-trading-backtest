<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' role='img' aria-labelledby='t d'>
<title id='t'>Wallets that were early on past news were not better to copy</title>
<desc id='d'>Grouped bar chart of copy returns. Early on three or more earlier jumps: +5.6%, -0.5%, +3.6%. Control: -0.1%, +8.2%, +4.5%.</desc>
<rect width='100%' height='100%' fill='#fcfcfb'/>
<text x='24.0' y='34.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='600' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Wallets that were early on past news were not better to copy</text>
<text x='24.0' y='56.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Each group's buys of $100+ on one side, mid-August to October 2026, copied at a later price a copier could get, per $1</text>
<line x1='70' y1='370.0' x2='730' y2='370.0' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='374.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>-5</text>
<line x1='70' y1='283.3' x2='730' y2='283.3' stroke='#52514e' stroke-width='1.5'/>
<text x='62.0' y='287.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>0</text>
<line x1='70' y1='196.7' x2='730' y2='196.7' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='200.7' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+5</text>
<line x1='70' y1='110.0' x2='730' y2='110.0' stroke='#e4e3df' stroke-width='1'/>
<text x='62.0' y='114.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='end' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+10</text>
<text x='180.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Bought 24 h to 2 min before</text>
<rect x='145.0' y='186.3' width='34.0' height='97.1' rx='3' fill='#2a78d6'/>
<text x='162.0' y='180.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+5.6</text>
<rect x='181.0' y='283.3' width='34.0' height='1.7' rx='3' fill='#eb6834'/>
<text x='198.0' y='300.1' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>-0.1</text>
<text x='400.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Bought 2 h to 2 min before</text>
<rect x='365.0' y='283.3' width='34.0' height='8.7' rx='3' fill='#2a78d6'/>
<text x='382.0' y='307.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>-0.5</text>
<rect x='401.0' y='141.2' width='34.0' height='142.1' rx='3' fill='#eb6834'/>
<text x='418.0' y='135.2' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+8.2</text>
<text x='620.0' y='390.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Bought in the first minutes</text>
<rect x='585.0' y='220.9' width='34.0' height='62.4' rx='3' fill='#2a78d6'/>
<text x='602.0' y='214.9' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+3.6</text>
<rect x='621.0' y='205.3' width='34.0' height='78.0' rx='3' fill='#eb6834'/>
<text x='638.0' y='199.3' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>+4.5</text>
<text x='400.0' y='418.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>When the group bought on the earlier jumps</text>
<text transform='translate(18 240.0) rotate(-90)' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='middle'>% per $1 staked</text>
<rect x='70.0' y='73' width='10' height='10' rx='2' fill='#2a78d6'/>
<text x='85.0' y='82.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Early on 3+ earlier news jumps</text>
<rect x='325.0' y='73' width='10' height='10' rx='2' fill='#eb6834'/>
<text x='340.0' y='82.0' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400' stroke='#fcfcfb' stroke-width='3' paint-order='stroke'>Control: same minimum activity, no early record</text>
</svg>